name: Ansible Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ansible-validation:
    name: Validate Ansible Playbooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Display Ansible version
        run: ansible-playbook --version

      - name: Syntax check backend playbook
        run: |
          ansible-playbook \
            -i inventory.example.ini \
            backend.yml \
            --syntax-check

      - name: Syntax check TLS check playbook
        run: |
          ansible-playbook \
            -i localhost, \
            check-tls.yml \
            --syntax-check

      - name: Syntax check TLS remediation playbook
        run: |
          ansible-playbook \
            -i localhost, \
            remediate-tls.yml \
            --syntax-check

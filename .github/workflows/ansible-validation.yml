name: Ansible Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compliance-evidence:
    name: Validate synthetic compliance evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test workflow and rejection cases
        run: python -m unittest discover -s tests -v
      - name: Run local compliance demonstration
        run: python scripts/compliance_workflow.py run --input examples/compliance/scenario.json --output artifacts/compliance-demo --as-of 2026-10-10
      - name: Verify evidence bundle
        run: python scripts/compliance_workflow.py verify --output artifacts/compliance-demo --as-of 2026-10-10
      - name: Retain demonstration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-compliance-evidence
          path: artifacts/compliance-demo/
          if-no-files-found: error
          retention-days: 14
  ansible-validation:
    name: Validate Ansible Playbooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Display Ansible version
        run: ansible-playbook --version

      - name: Syntax check backend playbook
        run: |
          ansible-playbook \
            -i inventory.example.ini \
            backend.yml \
            --syntax-check

      - name: Syntax check TLS check playbook
        run: |
          ansible-playbook \
            -i localhost, \
            check-tls.yml \
            --syntax-check

      - name: Syntax check TLS remediation playbook
        run: |
          ansible-playbook \
            -i localhost, \
            remediate-tls.yml \
            --syntax-check
